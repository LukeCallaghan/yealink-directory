services:
  directory:
    image: ${IMAGE:-yealink-directory:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set a shared password of at least 12 characters in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - directory-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s

volumes:
  directory-data:
