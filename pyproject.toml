[project]
name = "yealink-directory"
version = "0.1.0"
description = "Offline LAN directory manager for Yealink phones"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "waitress>=3,<4", "cryptography>=44", "defusedxml>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
